add_to_shopping_list_by_name:
  name: Add to shopping list by name
  description: >-
    Add a product to the Storage shopping list by its name (Finnish or matched).
    Resolves the name to an existing Storage product with a case-insensitive
    match (exact first, then substring). Example: "add Sprite to the shopping
    list". Returns status "added" with the matched product when exactly one
    product matches, "ambiguous" with a candidates list when several match (call
    again with a more specific name), or "not_found" with an empty candidates
    list when nothing matches. This service NEVER creates products. If the
    product is unknown (status not_found), search for it with
    scraper.search_products, add it with scraper.add_product, then call this
    service again with the now-known name. It may also return status "error"
    with a "message" when Storage cannot be reached (a transient failure — do
    NOT treat it as a missing product; retry later). This is the grocery
    shopping list backed by Storage products — for generic to-do/checklist items
    (not groceries to buy), use ha_lists.add_item instead.
  fields:
    name:
      name: Name
      description: Product name to resolve against existing Storage products.
      required: true
      example: Sprite
      selector:
        text:
    amount:
      name: Amount
      description: How many to add. Defaults to 1.
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 0
          mode: box
    note:
      name: Note
      description: Free-text note attached to the entry.
      required: false
      example: Buy organic
      selector:
        text:

add_to_shopping_list:
  name: Add to shopping list
  description: >-
    Add a product to the Storage shopping list by its numeric product_id. If you
    only know the product name, use add_to_shopping_list_by_name instead.
  fields:
    product_id:
      name: Product ID
      description: Storage product ID to add.
      required: true
      example: 42
      selector:
        number:
          mode: box
    amount:
      name: Amount
      description: How many to add. Defaults to 1.
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 0
          mode: box
    unit_id:
      name: Unit ID
      description: Optional Storage unit ID to override the product's default unit.
      required: false
      selector:
        number:
          mode: box
    note:
      name: Note
      description: Free-text note attached to the entry.
      required: false
      example: Buy organic
      selector:
        text:

find_stock:
  name: Find stock
  description: >-
    Look up what is in stock at home: which products, how many of each and
    where. Example: "do we have any eggs?", "what is in the freezer?", "how many
    bags of fries are left?". Filter by product name, by location, or both;
    with neither it returns everything. Product names are Finnish. Each row has
    the product_id that consume_stock needs and, when known, its earliest
    best_before date. For "what expires soon?" pass expiring_within_days.
  fields:
    name:
      name: Name
      description: Word to look for in the product name, best in Finnish (fries = ranskalaiset).
      required: false
      example: ranskalaiset
      selector:
        text:
    location:
      name: Location
      description: Only this storage location, e.g. Freezer, Fridge or Pantry.
      required: false
      example: Freezer
      selector:
        text:
    expiring_within_days:
      name: Expiring within days
      description: Only products whose best-before date is within this many days (0 = today or already past), soonest first.
      required: false
      example: 7
      selector:
        number:
          min: 0
          max: 365
          mode: box

add_stock:
  name: Add stock
  description: >-
    Put a product into stock because it was bought or restocked. Example: "I
    bought two cartons of milk", "we got more eggs, put them in the fridge".
    The product is matched by its Storage name (names are Finnish); a name that
    is not exact returns the possible products to pick from. Buying something
    also takes it off the shopping list.
  fields:
    name:
      name: Name
      description: The product's name in Storage, best in Finnish (milk = maito).
      required: true
      example: Valio Eila kevytmaitojuoma 2,5dl
      selector:
        text:
    amount:
      name: Amount
      description: How many were bought. Defaults to 1.
      required: false
      example: 2
      selector:
        number:
          min: 0
          mode: box
    location:
      name: Location
      description: Where it was put, e.g. Fridge. Leave out for the product's usual place.
      required: false
      example: Fridge
      selector:
        text:
    best_before:
      name: Best before
      description: Best-before date, if the user said one. Leave out for the product's usual shelf life.
      required: false
      example: "2026-12-01"
      selector:
        date:

consume_stock:
  name: Consume stock
  description: >-
    Take a product out of stock because it was eaten, used up, finished or
    thrown away (oldest first). Example: "we ate the fries in the freezer",
    "consume all the milk", "I used two eggs". Get the product_id and the
    amount in stock from find_stock first; to consume all of it, pass the whole
    amount find_stock reports. Set spoiled when it went bad, so it counts as
    waste. Returns how many were consumed.
  fields:
    product_id:
      name: Product ID
      description: Storage product ID to consume from, as returned by find_stock.
      required: true
      example: 42
      selector:
        number:
          mode: box
    amount:
      name: Amount
      description: How many to consume.
      required: true
      example: 1
      selector:
        number:
          min: 0
          mode: box
    location:
      name: Location
      description: Only take from this storage location, e.g. Freezer. Leave out to take the oldest anywhere.
      required: false
      example: Freezer
      selector:
        text:
    spoiled:
      name: Spoiled
      description: True when it went bad or expired and was thrown away, instead of being eaten or used.
      required: false
      default: false
      selector:
        boolean:

get_weekly_digest:
  name: Get weekly digest
  description: >-
    Return the Storage weekly digest (waste value, expiring lots, predicted
    runouts). Designed to be called from an automation and piped into
    `notify.*` via a response template.
  fields: {}

run_optimize:
  name: Run AI optimize
  description: Trigger the Storage AI optimize background job. 409 if already running.
  fields:
    product_ids:
      name: Product IDs
      description: Optional list of product IDs to optimize. If omitted, runs full optimize.
      required: false
      example: "[12, 34]"
      selector:
        object:
    fresh_seed:
      name: Fresh seed
      description: Reseed all category data before running.
      required: false
      default: false
      selector:
        boolean:
