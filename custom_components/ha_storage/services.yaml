add_to_shopping_list_by_name:
  name: Add to shopping list by name
  description: >-
    Add a product to the Storage shopping list by its name (Finnish or matched).
    Resolves the name to an existing Storage product with a case-insensitive
    match (exact first, then substring). Example: "add Sprite to the shopping
    list". Returns status "added" with the matched product when exactly one
    product matches, "ambiguous" with a candidates list when several match (call
    again with a more specific name), or "not_found" with an empty candidates
    list when nothing matches. This service NEVER creates products. If the
    product is unknown (status not_found), search for it with
    scraper.search_products, add it with scraper.add_product, then call this
    service again with the now-known name. It may also return status "error"
    with a "message" when Storage cannot be reached (a transient failure — do
    NOT treat it as a missing product; retry later).
  fields:
    name:
      name: Name
      description: Product name to resolve against existing Storage products.
      required: true
      example: Sprite
      selector:
        text:
    amount:
      name: Amount
      description: How many to add. Defaults to 1.
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 0
          mode: box
    note:
      name: Note
      description: Free-text note attached to the entry.
      required: false
      example: Buy organic
      selector:
        text:

add_to_shopping_list:
  name: Add to shopping list
  description: Add a product to the Storage shopping list.
  fields:
    product_id:
      name: Product ID
      description: Storage product ID to add.
      required: true
      example: 42
      selector:
        number:
          mode: box
    amount:
      name: Amount
      description: How many to add. Defaults to 1.
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 0
          mode: box
    unit_id:
      name: Unit ID
      description: Optional Storage unit ID to override the product's default unit.
      required: false
      selector:
        number:
          mode: box
    note:
      name: Note
      description: Free-text note attached to the entry.
      required: false
      example: Buy organic
      selector:
        text:

consume_stock:
  name: Consume stock
  description: Consume N of a product from stock (FIFO by best-before date).
  fields:
    product_id:
      name: Product ID
      description: Storage product ID to consume from.
      required: true
      example: 42
      selector:
        number:
          mode: box
    amount:
      name: Amount
      description: How many to consume.
      required: true
      example: 1
      selector:
        number:
          min: 0
          mode: box

get_weekly_digest:
  name: Get weekly digest
  description: >-
    Return the Storage weekly digest (waste value, expiring lots, predicted
    runouts). Designed to be called from an automation and piped into
    `notify.*` via a response template.
  fields: {}

run_optimize:
  name: Run AI optimize
  description: Trigger the Storage AI optimize background job. 409 if already running.
  fields:
    product_ids:
      name: Product IDs
      description: Optional list of product IDs to optimize. If omitted, runs full optimize.
      required: false
      example: "[12, 34]"
      selector:
        object:
    fresh_seed:
      name: Fresh seed
      description: Reseed all category data before running.
      required: false
      default: false
      selector:
        boolean:
